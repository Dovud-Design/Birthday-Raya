<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>Рая ✨ Полночная роскошь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --gold:#f6d27a;--gold2:#c8963e;--rose:#ff2d55;
  --vh:1vh;
  --fs:clamp(16px,min(4.9vw,calc(var(--vh)*2.6)),28px);
  --goldgrad:linear-gradient(100deg,#b8862f 0%,#fff1c1 28%,#f6d27a 44%,#c8963e 60%,#fff6d6 80%,#b8862f 100%);
}
@supports(height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#02030a;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;font-family:'Cormorant Garamond','Times New Roman',serif;color:#f6ead3;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- atmosphere ---------- */
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(90% 55% at 50% 108%,rgba(24,48,128,.55),transparent 70%),
  radial-gradient(60% 45% at 15% 12%,rgba(30,40,110,.35),transparent 70%),
  radial-gradient(55% 40% at 88% 28%,rgba(80,20,90,.22),transparent 70%),
  linear-gradient(180deg,#010208 0%,#050a1f 55%,#0a1340 120%)}
.galaxy{position:fixed;left:-30%;top:25%;width:160%;height:30%;z-index:0;transform:rotate(-28deg);
  background:radial-gradient(50% 50% at 50% 50%,rgba(150,170,255,.16),rgba(120,90,200,.07) 50%,transparent 75%);
  filter:blur(18px);opacity:0;animation:fadeTo 9s ease 1s forwards}
@keyframes fadeTo{to{opacity:1}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:1}
#fx{z-index:5}
.vig{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,6,.75) 100%)}
.grain{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- scenes ---------- */
#stage{position:fixed;inset:0;z-index:4}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top) + 48px) 22px calc(env(safe-area-inset-bottom) + 28px);text-align:center;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.07);filter:blur(14px);
  transition:opacity 1.3s ease,transform 1.8s cubic-bezier(.2,.7,.2,1),filter 1.3s ease,visibility 0s 1.3s;
  scrollbar-width:none}
.scene::-webkit-scrollbar{display:none}
.scene.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;
  transition:opacity 1.4s ease .1s,transform 2s cubic-bezier(.2,.7,.2,1),filter 1.4s ease .1s,visibility 0s}
.col{margin:auto;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center}

/* ornament */
.orn{position:relative;width:130px;height:14px;margin-bottom:24px;opacity:0;transform:scaleX(.2);transition:opacity 1.8s ease,transform 2s cubic-bezier(.2,.8,.2,1)}
.orn.on{opacity:1;transform:none}
.orn::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.orn::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;transform:rotate(45deg);border:1px solid var(--gold);background:#03061a;box-shadow:0 0 12px rgba(246,210,122,.7)}

/* text reveal */
.word{display:inline-block;white-space:nowrap}
.ltr{display:inline-block;opacity:0;animation:letterIn 1.5s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
.w{display:inline-block;opacity:0;animation:wIn 1.3s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
@keyframes letterIn{0%{opacity:0;transform:translateY(.45em) scale(1.7);filter:blur(14px)}55%{opacity:1}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes wIn{0%{opacity:0;transform:translateY(16px);filter:blur(10px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-100% 0}}
.goldtxt .ltr,.goldtxt .w{background:var(--goldgrad);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.goldtxt .ltr{animation:letterIn 1.5s cubic-bezier(.2,.8,.2,1) var(--d) forwards,shimmer 6s linear calc(var(--d) + 1.5s) infinite}
.goldtxt .w{animation:wIn 1.3s cubic-bezier(.2,.8,.2,1) var(--d) forwards,shimmer 6s linear calc(var(--d) + 1.3s) infinite}
.goldtxt .emo{background:none!important;-webkit-text-fill-color:initial!important;color:inherit}

/* scene 1 */
.eyebrow{font-style:italic;font-weight:500;letter-spacing:.06em;font-size:clamp(22px,min(6.6vw,calc(var(--vh)*3.2)),38px);margin-bottom:20px;filter:drop-shadow(0 0 14px rgba(246,210,122,.45))}
.lead{font-family:'Playfair Display',Georgia,serif;font-weight:500;line-height:1.38;max-width:15em;color:#fff4de;
  font-size:clamp(24px,min(7vw,calc(var(--vh)*3.6)),42px);text-shadow:0 0 28px rgba(255,200,120,.3),0 2px 12px rgba(0,0,0,.7)}

/* buttons */
.btn{position:relative;margin-top:38px;padding:16px 40px;border-radius:999px;overflow:hidden;
  font-weight:600;font-size:clamp(17px,4.6vw,20px);letter-spacing:.14em;color:#fff1cf;
  background:linear-gradient(135deg,rgba(246,210,122,.2),rgba(255,45,85,.14));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 0 26px rgba(246,210,122,.25),inset 0 0 20px rgba(246,210,122,.12);
  border:1px solid rgba(246,210,122,.25);
  opacity:0;transform:translateY(14px) scale(.96);pointer-events:none;
  transition:opacity 1.4s ease,transform 1.4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.btn.show{opacity:1;transform:none;pointer-events:auto;animation:btnPulse 3.2s ease-in-out 1.5s infinite}
.btn::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.6px;
  background:conic-gradient(from var(--ang),transparent 0 62%,#ffe9a8 82%,#ff2d55 94%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spinAng 3.2s linear infinite}
.btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,240,200,.35),transparent);animation:sweep 4s ease-in-out infinite}
.btn:active{transform:scale(.96)}
.btn span{position:relative;z-index:1}
.btn.ghost{margin-top:26px;padding:12px 30px;font-size:clamp(15px,4vw,18px)}
@keyframes spinAng{to{--ang:360deg}}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 22px rgba(246,210,122,.22),inset 0 0 20px rgba(246,210,122,.1)}50%{box-shadow:0 0 44px rgba(255,120,120,.4),inset 0 0 26px rgba(246,210,122,.2)}}

/* scene 2 */
.rose-wrap{position:relative;height:min(calc(var(--vh)*46),98vw);aspect-ratio:400/560;flex:none;perspective:900px}
.rose-glow{position:absolute;left:50%;top:34%;width:155%;aspect-ratio:1;translate:-50% -50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,40,70,.45),rgba(190,10,40,.18) 38%,transparent 68%);filter:blur(10px);
  opacity:0;transition:opacity 3.5s ease 1s;animation:pulseGlow 4.5s ease-in-out infinite}
.rose-wrap.on .rose-glow{opacity:1}
@keyframes pulseGlow{0%,100%{transform:scale(.92)}50%{transform:scale(1.06)}}
.rose-float{position:absolute;inset:0;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.rose-tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out}
#roseSvg{width:100%;height:100%;overflow:visible}
.greet{margin-top:1.2vh;font-style:italic;letter-spacing:.07em;color:#f4dfb4;font-size:clamp(20px,min(5.6vw,calc(var(--vh)*3)),32px);text-shadow:0 0 18px rgba(255,190,90,.3)}
.name{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;line-height:1.05;
  font-size:clamp(64px,min(21vw,calc(var(--vh)*12)),130px);filter:drop-shadow(0 0 16px rgba(255,190,80,.45))}
#b2{margin-top:2.4vh}

/* scene 3 */
.poem{max-width:30em}
.pl{font-size:var(--fs);line-height:1.5;font-weight:500;margin-bottom:1em;color:#f6ead3;text-shadow:0 0 20px rgba(255,200,120,.22),0 2px 10px rgba(0,0,0,.65)}
.pl.first{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:calc(var(--fs)*1.12);color:#ffe2a6;margin-bottom:1.3em}
.pl.last{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:calc(var(--fs)*1.08);color:#ffd9de}

/* scene 4 */
.heartbox{position:relative;width:min(62vw,calc(var(--vh)*30));aspect-ratio:1;flex:none;cursor:pointer;margin-bottom:2vh}
.halo{position:absolute;inset:-38%;pointer-events:none;opacity:0;transition:opacity 2.4s ease;
  background:radial-gradient(circle,rgba(255,40,80,.38),rgba(200,0,40,.13) 40%,transparent 66%);animation:halo .95s ease-in-out infinite}
.heartbox.on .halo{opacity:1}
@keyframes halo{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}42%{transform:scale(1.05)}}
.heart-core{position:absolute;inset:12%;opacity:0;transform:scale(.1);transition:opacity 1.6s ease,transform 2.2s cubic-bezier(.2,1.4,.3,1)}
.heart-core.show{opacity:1;transform:scale(1)}
.heart-core svg{width:100%;height:100%;overflow:visible;transform-origin:50% 55%;animation:beat .95s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(255,40,80,.9)) drop-shadow(0 0 54px rgba(255,40,80,.5))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(1)}42%{transform:scale(1.05)}55%{transform:scale(1)}}
.fin1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;line-height:1.3;max-width:14em;
  font-size:clamp(22px,min(6.4vw,calc(var(--vh)*3.3)),38px);filter:drop-shadow(0 0 14px rgba(255,190,80,.4))}
.fin2{margin-top:2.2vh;font-style:italic;letter-spacing:.1em;color:#ffd9a0;font-size:clamp(18px,min(5vw,calc(var(--vh)*2.6)),26px);text-shadow:0 0 18px rgba(255,190,90,.35)}

/* scene 5 — photo */
.photo-wrap{position:relative;width:min(76vw,calc(var(--vh)*38));aspect-ratio:4/5;flex:none;perspective:900px}
.photo-glow{position:absolute;inset:-16%;pointer-events:none;opacity:0;transition:opacity 2.5s ease .6s;
  background:radial-gradient(closest-side,rgba(255,200,100,.5),rgba(255,160,60,.18) 55%,transparent 78%);animation:pulseGlow 4.5s ease-in-out infinite}
.photo-wrap.on .photo-glow{opacity:1}
.photo-frame{position:absolute;inset:0;padding:6px;border-radius:22px;opacity:0;transform:scale(.8) rotateX(12deg);
  background:linear-gradient(135deg,#fff1c1,#c8963e 28%,#7a5418 50%,#f6d27a 72%,#fff1c1);
  box-shadow:0 0 40px rgba(246,210,122,.55),0 0 110px rgba(255,170,60,.3),0 22px 50px rgba(0,0,0,.6);
  transition:opacity 1.6s ease,transform 2.4s cubic-bezier(.2,.8,.2,1)}
.photo-wrap.on .photo-frame{opacity:1;transform:none}
.photo-img{position:relative;width:100%;height:100%;border-radius:17px;overflow:hidden;background:#000;
  clip-path:inset(50% 50% 50% 50% round 17px);transition:clip-path 2.6s cubic-bezier(.65,0,.15,1) .8s}
.photo-wrap.on .photo-img{clip-path:inset(0 0 0 0 round 17px)}
.photo-img img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;
  filter:blur(18px) brightness(.4);transform:scale(1.15);transition:filter 3s ease 1.2s,transform 4s ease 1s}
.photo-wrap.on .photo-img img{filter:none;transform:scale(1)}
.photo-sheen{position:absolute;inset:0;pointer-events:none;transform:translateX(-130%);
  background:linear-gradient(110deg,transparent 35%,rgba(255,240,200,.3) 50%,transparent 65%)}
.photo-wrap.on .photo-sheen{animation:sheen 6s ease-in-out 4.2s infinite}
@keyframes sheen{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cap{margin-top:3.2vh;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;line-height:1.35;max-width:14em;
  font-size:clamp(20px,min(5.6vw,calc(var(--vh)*3)),32px);filter:drop-shadow(0 0 14px rgba(255,190,80,.4))}

/* music toggle */
#music{position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(246,210,122,.5);background:rgba(10,14,40,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:0 0 18px rgba(246,210,122,.2);
  opacity:0;animation:fadeTo 2s ease 2s forwards}
#music i{display:block;width:3px;height:14px;border-radius:2px;background:linear-gradient(#ffe9a8,#c8963e);transform:scaleY(.25);transition:transform .4s}
#music.on i{animation:eq 1.1s ease-in-out infinite}
#music.on i:nth-child(2){animation-delay:-.3s}
#music.on i:nth-child(3){animation-delay:-.6s}
#music.on i:nth-child(4){animation-delay:-.9s}
#music:not(.on)::after{content:'';position:absolute;width:26px;height:1.6px;background:#ffe9a8;transform:rotate(-45deg);opacity:.9;box-shadow:0 0 6px rgba(0,0,0,.6)}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){.rose-float,.rose-glow,.halo{animation:none}}
</style>
</head>
<body data-s="0">

<div id="bg"></div>
<div class="galaxy"></div>
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>
<div class="vig"></div>
<div class="grain"></div>

<main id="stage">

  <!-- SCENE 1 -->
  <section class="scene" id="s1"><div class="col">
    <div class="orn" id="o1"></div>
    <p class="eyebrow goldtxt" id="t1a"></p>
    <h1 class="lead" id="t1b"></h1>
    <button class="btn" id="b1" type="button"><span>Продолжить ✨</span></button>
  </div></section>

  <!-- SCENE 2 -->
  <section class="scene" id="s2"><div class="col">
    <div class="rose-wrap" id="roseWrap">
      <div class="rose-glow"></div>
      <div class="rose-float"><div class="rose-tilt" id="roseTilt">
        <svg id="roseSvg" viewBox="0 0 400 560" aria-hidden="true">
          <defs>
            <linearGradient id="stemG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6b3c"/><stop offset="1" stop-color="#0c2a19"/></linearGradient>
            <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b5a32"/><stop offset=".6" stop-color="#2f7d47"/><stop offset="1" stop-color="#143f25"/></linearGradient>
            <radialGradient id="spec" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(255,190,200,.32)"/><stop offset="1" stop-color="rgba(255,190,200,0)"/></radialGradient>
            <radialGradient id="dew" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="rgba(255,255,255,.95)"/><stop offset=".5" stop-color="rgba(255,210,220,.45)"/><stop offset="1" stop-color="rgba(255,255,255,.08)"/></radialGradient>
            <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(20,0,4,.85)"/><stop offset="1" stop-color="rgba(20,0,4,0)"/></radialGradient>
          </defs>
          <path id="stem" d="M200 240 C 192 330, 214 430, 198 560" fill="none" stroke="url(#stemG)" stroke-width="10" stroke-linecap="round"/>
          <g id="leafA" transform="translate(205,392) rotate(-22) scale(0)">
            <path d="M0 0 C25 -36 82 -42 128 -8 C86 24 28 28 0 0Z" fill="url(#leafG)" stroke="rgba(0,0,0,.35)" stroke-width=".8"/>
            <path d="M4 0 C42 -6 84 -10 120 -8" fill="none" stroke="rgba(190,255,200,.35)" stroke-width="1.2"/>
          </g>
          <g id="leafB" transform="translate(198,462) scale(0)">
            <path d="M0 0 C25 -36 82 -42 128 -8 C86 24 28 28 0 0Z" fill="url(#leafG)" stroke="rgba(0,0,0,.35)" stroke-width=".8"/>
            <path d="M4 0 C42 -6 84 -10 120 -8" fill="none" stroke="rgba(190,255,200,.35)" stroke-width="1.2"/>
          </g>
          <path d="M202 340 l10 -6 l-3 12z M199 420 l-11 -6 l4 12z" fill="#1d5a33"/>
          <ellipse cx="200" cy="268" rx="40" ry="24" fill="#16452a"/>
          <g id="head" transform="translate(200,190)"></g>
          <g id="dews" opacity="0"></g>
        </svg>
      </div></div>
    </div>
    <p class="greet" id="t2a"></p>
    <h2 class="name goldtxt" id="t2b"></h2>
    <button class="btn" id="b2" type="button"><span>Дальше ✨</span></button>
  </div></section>

  <!-- SCENE 3 -->
  <section class="scene" id="s3"><div class="col poem">
    <div class="orn" id="o3"></div>
    <div id="poemLines"></div>
    <button class="btn" id="b3" type="button"><span>Дальше ❤️</span></button>
  </div></section>

  <!-- SCENE 4 -->
  <section class="scene" id="s4"><div class="col">
    <div class="heartbox" id="heartBox">
      <div class="halo"></div>
      <div class="heart-core" id="heartCore">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="hg" cx="34%" cy="28%" r="85%"><stop offset="0" stop-color="#ff9fb0"/><stop offset=".3" stop-color="#ff2d55"/><stop offset=".78" stop-color="#b0001f"/><stop offset="1" stop-color="#5e0010"/></radialGradient>
            <radialGradient id="hs" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(255,255,255,.7)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient>
          </defs>
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#hg)"/>
          <ellipse cx="7.6" cy="7" rx="2.6" ry="1.6" transform="rotate(-35 7.6 7)" fill="url(#hs)"/>
        </svg>
      </div>
    </div>
    <p class="fin1 goldtxt" id="t4a"></p>
    <p class="fin2" id="t4b"></p>
    <button class="btn ghost" id="b4" type="button"><span>Дальше ❤️</span></button>
  </div></section>

  <!-- SCENE 5 — HER PHOTO -->
  <section class="scene" id="s5"><div class="col">
    <div class="photo-wrap" id="photoWrap">
      <div class="photo-glow"></div>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
var $=function(id){return document.getElementById(id)};
var clamp=function(v,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,v))};
var lerp=function(a,b,t){return a+(b-a)*t};
var rnd=function(a,b){return a+Math.random()*(b-a)};
var easeOut=function(t){return 1-Math.pow(1-t,3)};
var easeBack=function(t){var c1=1.3,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var TAU=Math.PI*2;

var W=innerWidth,H=innerHeight,DPR=1,T=0;
var sc=$('stars'),sx=sc.getContext('2d'),fc=$('fx'),fx=fc.getContext('2d');

/* ================= sprites ================= */
function sprite(stops){
  var s=64,c=document.createElement('canvas');c.width=c.height=s;
  var g=c.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  stops.forEach(function(a){gr.addColorStop(a[0],a[1])});
  g.fillStyle=gr;g.fillRect(0,0,s,s);return c;
}
var SP={
  gold:sprite([[0,'rgba(255,246,214,1)'],[.18,'rgba(255,214,120,.95)'],[.5,'rgba(255,170,50,.28)'],[1,'rgba(255,150,30,0)']]),
  red:sprite([[0,'rgba(255,200,205,1)'],[.18,'rgba(255,70,100,.95)'],[.5,'rgba(220,20,60,.3)'],[1,'rgba(200,0,40,0)']]),
  white:sprite([[0,'rgba(255,255,255,1)'],[.2,'rgba(210,225,255,.7)'],[1,'rgba(180,200,255,0)']])
};

/* ================= resize ================= */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  [sc,fc].forEach(function(c){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)});
}
resize();
addEventListener('resize',resize);
addEventListener('orientationchange',function(){setTimeout(resize,250)});

/* ================= stars ================= */
var STAR_COL=['255,255,255','200,215,255','255,238,210','180,200,255'];
var starsByC=[[],[],[],[]];
(function buildStars(){
  var n=Math.min(2600,Math.floor(W*H/(reduce?520:270)));
  for(var i=0;i<n;i++){
    var u=Math.random(),v=Math.random();
    if(Math.random()<.32){u=Math.random();v=.95-.85*u+(Math.random()+Math.random()+Math.random()-1.5)*.14}
    var big=Math.random()<.03;
    starsByC[(Math.random()*4)|0].push({
      u:u,v:clamp(v,-.05,1.05),
      r:big?rnd(1.2,2):rnd(.25,1.05)*(Math.random()<.15?1.4:1),
      a:rnd(.35,1),sp:rnd(.6,3),ph:rnd(0,TAU),d:rnd(0,7),big:big
    });
  }
})();
var shoot=[],nextShoot=8;
var tpx=0,tpy=0,px=0,py=0;

function drawStars(dt){
  sx.setTransform(DPR,0,0,DPR,0,0);sx.clearRect(0,0,W,H);
  for(var c=0;c<4;c++){
    sx.fillStyle='rgb('+STAR_COL[c]+')';
    var arr=starsByC[c];
    for(var i=0;i<arr.length;i++){
      var s=arr[i],ap=clamp((T-s.d)/2.2);
      if(ap<=0)continue;
      var a=s.a*(.55+.45*Math.sin(T*s.sp+s.ph))*ap;
      var x=s.u*W+px*(2+s.r*8)+Math.sin(T*.05+s.ph)*2;
      var y=s.v*H+py*(2+s.r*6);
      sx.globalAlpha=a;
      if(s.r<.75){sx.fillRect(x,y,s.r*1.7,s.r*1.7)}
      else{sx.beginPath();sx.arc(x,y,s.r,0,TAU);sx.fill()}
      if(s.big){sx.globalAlpha=a*.55;sx.drawImage(SP.white,x-s.r*6,y-s.r*6,s.r*12,s.r*12)}
    }
  }
  sx.globalAlpha=1;
  if(T>nextShoot){
    nextShoot=T+rnd(5,11);
    shoot.push({x:rnd(.35,1)*W,y:rnd(0,.35)*H,vx:-rnd(520,820),vy:rnd(240,420),l:0,max:rnd(.7,1.1)});
  }
  for(var k=shoot.length-1;k>=0;k--){
    var m=shoot[k];m.l+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(m.l>m.max){shoot.splice(k,1);continue}
    var al=Math.sin(m.l/m.max*Math.PI);
    var tx=m.x-m.vx*.16,ty=m.y-m.vy*.16;
    var g=sx.createLinearGradient(m.x,m.y,tx,ty);
    g.addColorStop(0,'rgba(255,255,255,'+al+')');g.addColorStop(1,'rgba(255,255,255,0)');
    sx.strokeStyle=g;sx.lineWidth=1.6;sx.beginPath();sx.moveTo(m.x,m.y);sx.lineTo(tx,ty);sx.stroke();
  }
}

/* ================= gold dust / petals / heart particles ================= */
var dust=[];
(function(){
  var n=Math.round((W<600?70:140)*(reduce?.5:1));
  for(var i=0;i<n;i++){
    var big=Math.random()<.14;
    dust.push({u:Math.random(),v:Math.random(),s:big?rnd(26,60):rnd(3,10),a:big?rnd(.05,.12):rnd(.35,.95),
      vy:big?rnd(4,10):rnd(8,28),sw:rnd(0,TAU),sa:rnd(.01,.05),sp:rnd(.3,1.1),tw:rnd(.8,3),big:big});
  }
})();
var petals=[];
(function(){
  for(var i=0;i<36;i++)petals.push({x:rnd(0,W),y:rnd(-H,H),vy:rnd(28,66),vx:rnd(-8,8),rot:rnd(0,TAU),vr:rnd(-1.5,1.5),sz:rnd(6,13),ph:rnd(0,TAU)});
})();

/* heart geometry */
function hxy(t){return [16*Math.pow(Math.sin(t),3),13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]}
var HP=[],midY=0;
(function(){
  var mn=1e9,mx=-1e9;
  for(var t=0;t<TAU;t+=.01){var y=hxy(t)[1];if(y<mn)mn=y;if(y>mx)mx=y}
  midY=(mn+mx)/2;
  var n=Math.round(520*(reduce?.5:1)*(W<500?.85:1));
  for(var i=0;i<n;i++){
    var outline=Math.random()<.55,t2=rnd(0,TAU),p=hxy(t2);
    var k=outline?1-Math.random()*.05:Math.sqrt(Math.random())*.96;
    HP.push({X:(p[0]/16)*k,Y:-((p[1]-midY)/16)*k,sx:Math.random(),sy:Math.random(),dl:rnd(0,2.4),
      ph:rnd(0,TAU),am:rnd(.5,5),sp:rnd(.6,2),col:Math.random()<.5?0:1,s:outline?rnd(3,7):rnd(2,5),o:outline});
  }
})();
var floaters=[],sparks=[],emitAcc=0;

function spark(x,y){
  for(var i=0;i<2;i++)sparks.push({x:x+rnd(-6,6),y:y+rnd(-6,6),vx:rnd(-30,30),vy:rnd(-50,-5),l:0,max:rnd(.6,1.2),s:rnd(2,5),c:Math.random()<.75?'gold':'red'});
  if(sparks.length>500)sparks.splice(0,sparks.length-500);
}
function burst(x,y,n){
  for(var i=0;i<n;i++){
    var a=rnd(0,TAU),v=rnd(60,280);
    sparks.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:0,max:rnd(.9,1.9),s:rnd(2,7),c:Math.random()<.6?'gold':'red'});
  }
  if(sparks.length>500)sparks.splice(0,sparks.length-500);
}

var vis={dust:0,petal:0,rays:0,heart:0};
var SC={1:{dust:.35,petal:0,rays:0},2:{dust:1,petal:.5,rays:1},3:{dust:.85,petal:1,rays:0},4:{dust:.9,petal:.5,rays:.9},5:{dust:1,petal:1,rays:.8}};
var cur=0,heartOn=false,heartT0=-1e9,photoT0=1e9,photoAcc=0;
var rc={x:W/2,y:H*.4,s:200};
var roseWrap=$('roseWrap'),heartBox=$('heartBox');

function updateCenter(){
  var r;
  if(cur===4){r=heartBox.getBoundingClientRect();rc={x:r.left+r.width/2,y:r.top+r.height/2,s:r.width}}
  else if(cur===2){r=roseWrap.getBoundingClientRect();rc={x:r.left+r.width/2,y:r.top+r.height*.34,s:r.width}}
  else if(cur===5){r=$('photoFrame').getBoundingClientRect();rc={x:r.left+r.width/2,y:r.top+r.height/2,s:r.width,h:r.height}}
}
function rays(cx,cy,R,a,col){
  fx.save();fx.translate(cx,cy);fx.rotate(T*.05);fx.globalCompositeOperation='lighter';
  var g=fx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0,'rgba('+col+','+(.2*a).toFixed(3)+')');g.addColorStop(1,'rgba('+col+',0)');
  fx.fillStyle=g;
  var n=16;
  for(var i=0;i<n;i++){
    var a0=i/n*TAU,w=.07+.05*Math.sin(i*2.3+T*.4);
    fx.beginPath();fx.moveTo(0,0);fx.arc(0,0,R,a0,a0+w);fx.closePath();fx.fill();
  }
  fx.restore();
}

function drawFx(dt){
  fx.setTransform(DPR,0,0,DPR,0,0);fx.clearRect(0,0,W,H);
  var S=SC[cur]||SC[1],k=Math.min(1,dt*1.2),i,d,p,e;
  vis.dust+=(S.dust-vis.dust)*k;vis.petal+=(S.petal-vis.petal)*k;vis.rays+=(S.rays-vis.rays)*k;
  vis.heart+=((cur===4?1:0)-vis.heart)*Math.min(1,dt*2);
  if(cur===2||cur===4||cur===5)updateCenter();
  if(cur===5&&T>photoT0){
    photoAcc+=dt*26;
    while(photoAcc>=1){
      photoAcc--;
      var ex=rnd(-.5,.5),ey=rnd(-.5,.5);
      if(Math.random()<.5)ex=ex<0?-.5:.5;else ey=ey<0?-.5:.5;
      sparks.push({x:rc.x+ex*rc.s,y:rc.y+ey*(rc.h||rc.s*1.25),vx:rnd(-20,20),vy:rnd(-50,-10),l:0,max:rnd(1,2),s:rnd(2,5),c:Math.random()<.8?'gold':'red'});
    }
    if(sparks.length>500)sparks.splice(0,sparks.length-500);
  }

  /* god rays */
  if(vis.rays>.01){
    var rr=cur===4||(cur!==2&&heartOn)?'255,90,120':'255,214,130';
    rays(rc.x,rc.y,Math.max(W,H)*.9,vis.rays*(.75+.25*Math.sin(T*.6)),cur===4?'255,90,120':rr);
  }

  /* gold dust */
  fx.globalCompositeOperation='lighter';
  var boost=cur===2?1.5:1;
  for(i=0;i<dust.length;i++){
    d=dust[i];
    d.v-=d.vy*dt*boost/H;
    if(d.v<-.1){d.v=1.08;d.u=Math.random()}
    var x=d.u*W+Math.sin(T*d.sp+d.sw)*d.sa*W+px*(d.big?4:12),y=d.v*H;
    var a=d.a*(d.big?1:(.6+.4*Math.sin(T*d.tw+d.sw)))*vis.dust;
    if(a<=.005)continue;
    fx.globalAlpha=a;fx.drawImage(SP.gold,x-d.s,y-d.s,d.s*2,d.s*2);
  }

  /* falling petals */
  fx.globalCompositeOperation='source-over';
  if(vis.petal>.02){
    for(i=0;i<petals.length;i++){
      p=petals[i];
      p.y+=p.vy*dt;p.x+=(Math.sin(T*.8+p.ph)*22+p.vx)*dt;p.rot+=p.vr*dt;
      if(p.y>H+30){p.y=-30;p.x=rnd(0,W)}
      var fl=Math.cos(T*1.6+p.ph)*.55+.75,s=p.sz;
      fx.save();fx.translate(p.x,p.y);fx.rotate(p.rot);fx.scale(1,fl);
      fx.globalAlpha=.8*vis.petal;
      fx.fillStyle='rgb(170,8,36)';
      fx.beginPath();fx.moveTo(0,-s);fx.bezierCurveTo(s*.95,-s*.6,s*.7,s*.6,0,s);fx.bezierCurveTo(-s*.7,s*.6,-s*.95,-s*.6,0,-s);fx.fill();
      fx.fillStyle='rgba(255,110,130,.35)';
      fx.beginPath();fx.ellipse(-s*.15,-s*.25,s*.28,s*.5,0,0,TAU);fx.fill();
      fx.restore();
    }
  }

  fx.globalCompositeOperation='lighter';

  /* heart particles */
  if(heartOn&&vis.heart>.02){
    var ph=(T*1.05)%1;
    var pulse=1+.05*(Math.exp(-Math.pow((ph-.1)/.05,2))+.7*Math.exp(-Math.pow((ph-.3)/.06,2)));
    var R=rc.s*.47*pulse;
    for(i=0;i<HP.length;i++){
      p=HP[i];
      e=easeOut(clamp((T-heartT0-p.dl)/2));
      if(e<=0)continue;
      var tx=rc.x+p.X*R+Math.cos(T*p.sp+p.ph)*p.am*e;
      var ty=rc.y+p.Y*R+Math.sin(T*p.sp*1.3+p.ph)*p.am*e;
      var hx=lerp(p.sx*W,tx,e)+(1-e)*Math.sin(p.ph*3)*60;
      var hy=lerp(p.sy*H,ty,e)+(1-e)*Math.cos(p.ph*3)*60;
      fx.globalAlpha=clamp((.35+.65*e)*(.7+.3*Math.sin(T*2+p.ph))*vis.heart);
      var sz=p.s*1.7;
      fx.drawImage(p.col?SP.gold:SP.red,hx-sz,hy-sz,sz*2,sz*2);
    }
    /* emit floating particles */
    if(cur===4&&T-heartT0>2){
      emitAcc+=dt*48;
      while(emitAcc>=1){
        emitAcc--;
        if(floaters.length>360)break;
        var q=HP[(Math.random()*HP.length)|0];
        floaters.push({x:rc.x+q.X*R,y:rc.y+q.Y*R,vx:q.X*rnd(8,30)+rnd(-10,10),vy:q.Y*rnd(8,26)-rnd(10,40),l:0,max:rnd(3,6.5),s:rnd(2,7),c:Math.random()<.5?'gold':'red'});
      }
    }
  }
  for(i=floaters.length-1;i>=0;i--){
    p=floaters[i];p.l+=dt;
    if(p.l>p.max){floaters.splice(i,1);continue}
    p.x+=(p.vx+Math.sin(T*1.2+i)*10)*dt;p.y+=p.vy*dt;p.vy-=6*dt;
    var r=p.l/p.max,al=r<.15?r/.15:1-(r-.15)/.85;
    fx.globalAlpha=clamp(al)*.9;
    var fs=p.s*1.7;
    fx.drawImage(p.c==='gold'?SP.gold:SP.red,p.x-fs,p.y-fs,fs*2,fs*2);
  }

  /* sparks */
  for(i=sparks.length-1;i>=0;i--){
    p=sparks[i];p.l+=dt;
    if(p.l>p.max){sparks.splice(i,1);continue}
    p.vy+=90*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;
    var q2=1-p.l/p.max;
    fx.globalAlpha=q2;
    var ss=p.s*(.6+q2*.8)*1.6;
    fx.drawImage(p.c==='gold'?SP.gold:SP.red,p.x-ss,p.y-ss,ss*2,ss*2);
  }
  fx.globalAlpha=1;fx.globalCompositeOperation='source-over';
}

/* ================= the rose ================= */
var NS='http://www.w3.org/2000/svg';
var PETAL='M0,0 C-.5,-.12 -.9,-.5 -.72,-.84 C-.58,-1.06 -.25,-1.04 0,-.93 C.25,-1.04 .58,-1.06 .72,-.84 C.9,-.5 .5,-.12 0,0Z';
var RIM='M-.72,-.84 C-.58,-1.06 -.25,-1.04 0,-.93 C.25,-1.04 .58,-1.06 .72,-.84';
var svg=$('roseSvg'),defs=svg.querySelector('defs'),gHead=$('head');
var rosePetals=[],roseOn=false,roseT0=0,ROSE_DUR=5.5;
var stem=$('stem'),leafA=$('leafA'),leafB=$('leafB'),dews=$('dews'),stemLen=300;

function mk(tag,attrs,parent){
  var e=document.createElementNS(NS,tag);
  for(var k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);return e;
}
function buildRose(){
  var N=40,i;
  for(i=N-1;i>=0;i--){
    var t=i/(N-1),size=22+68*Math.pow(t,.8),dist=2+32*t,ang=i*137.508+rnd(-6,6),jit=rnd(.93,1.07);
    var mix=function(a,b){return 'rgb('+a.map(function(v,k){return Math.round(clamp(lerp(v,b[k],t)*jit,0,255))}).join(',')+')'};
    var gid='pg'+i;
    var lg=mk('linearGradient',{id:gid,x1:0,y1:1,x2:0,y2:0},defs);
    mk('stop',{offset:0,'stop-color':mix([58,0,10],[96,2,18])},lg);
    mk('stop',{offset:.5,'stop-color':mix([120,4,22],[188,12,38])},lg);
    mk('stop',{offset:1,'stop-color':mix([186,16,40],[250,70,92])},lg);
    var g=mk('g',{},gHead);
    mk('path',{d:PETAL,fill:'#000','fill-opacity':.32,transform:'translate(0,.04) scale(1.06)'},g);
    mk('path',{d:PETAL,fill:'url(#'+gid+')',stroke:'rgba(40,0,10,.55)','stroke-width':.8,'vector-effect':'non-scaling-stroke'},g);
    mk('path',{d:RIM,fill:'none',stroke:'rgba(255,175,185,.5)','stroke-width':1.3,'vector-effect':'non-scaling-stroke','stroke-linecap':'round'},g);
    g.setAttribute('transform','scale(0)');
    rosePetals.push({g:g,t:t,size:size,dist:dist,ang:ang,ph:rnd(0,TAU)});
  }
  mk('circle',{cx:0,cy:0,r:18,fill:'url(#core)'},gHead);
  mk('circle',{cx:-28,cy:-44,r:86,fill:'url(#spec)'},gHead);
  [[-38,-52,2.8],[32,-30,2.3],[-12,30,2.5],[54,20,2]].forEach(function(d){
    mk('circle',{cx:200+d[0],cy:190+d[1],r:d[2],fill:'url(#dew)',stroke:'rgba(255,255,255,.5)','stroke-width':.4},dews);
    mk('circle',{cx:200+d[0]-d[2]*.3,cy:190+d[1]-d[2]*.35,r:d[2]*.28,fill:'#fff'},dews);
  });
  try{stemLen=stem.getTotalLength()}catch(e){}
  stem.style.strokeDasharray=stemLen;stem.style.strokeDashoffset=stemLen;
}
buildRose();

function animRose(){
  var p=clamp((T-roseT0)/ROSE_DUR);
  var ps=easeOut(clamp(p/.4));
  stem.style.strokeDashoffset=stemLen*(1-ps);
  var la=clamp((p-.2)/.35),lb=clamp((p-.32)/.35);
  leafA.setAttribute('transform','translate(205,392) rotate(-22) scale('+easeOut(la).toFixed(3)+')');
  leafB.setAttribute('transform','translate(198,462) scale('+(-easeOut(lb)).toFixed(3)+','+easeOut(lb).toFixed(3)+') rotate(-18)');
  for(var i=0;i<rosePetals.length;i++){
    var r=rosePetals[i],s0=.05+.6*r.t,e=clamp((p-s0)/.36);
    if(e<=0){r.g.setAttribute('transform','scale(0)');continue}
    var eb=easeBack(e);
    var br=1+.012*Math.sin(T*.9+r.ph),an=r.ang+(1-e)*55+Math.sin(T*.5+r.ph)*1.2;
    r.g.setAttribute('transform','rotate('+an.toFixed(2)+') translate(0,'+(-r.dist*eb).toFixed(2)+') scale('+(r.size*eb*br).toFixed(2)+' '+(r.size*eb*br*.94).toFixed(2)+')');
  }
  dews.setAttribute('opacity',clamp((p-.88)/.12).toFixed(2));
  gHead.setAttribute('transform','translate(200,190) rotate('+(Math.sin(T*.3)*1.6).toFixed(2)+')');
}

/* ================= music (generated, no files) ================= */
var Music=(function(){
  var ctx,master,dry,wet,timer=0,next=0,step=0,on=false,fadeT=0,sil=null,btn=$('music');
  var E=.42;
  var CH=[
    {b:45,n:[57,60,64,69,72],m:[76,72,79,76]},
    {b:41,n:[53,57,60,65,69],m:[77,81,72,77]},
    {b:48,n:[55,60,64,67,72],m:[79,76,84,79]},
    {b:43,n:[55,59,62,67,71],m:[74,79,71,74]}
  ];
  var ARP=[0,1,2,3,2,1,4,1];
  var f=function(m){return 440*Math.pow(2,(m-69)/12)};
  function impulse(sec,decay){
    var r=ctx.sampleRate,len=Math.floor(r*sec),b=ctx.createBuffer(2,len,r);
    for(var c=0;c<2;c++){var d=b.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}
    return b;
  }
  function build(){
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();
    var comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
    master=ctx.createGain();master.gain.value=0;
    dry=ctx.createGain();dry.gain.value=.75;
    wet=ctx.createGain();wet.gain.value=.55;
    var conv=ctx.createConvolver();conv.buffer=impulse(3.2,2.2);
    dry.connect(master);wet.connect(conv);conv.connect(master);master.connect(comp);comp.connect(ctx.destination);
    return true;
  }
  function pluck(m,t,v,dur){
    var o=ctx.createOscillator(),o2=ctx.createOscillator(),o3=ctx.createOscillator();
    var g=ctx.createGain(),g2=ctx.createGain(),g3=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='sine';o2.type='triangle';o3.type='sine';
    var fr=f(m);o.frequency.value=fr;o2.frequency.value=fr*2;o2.detune.value=4;o3.frequency.value=fr*3;
    g2.gain.value=.22;g3.gain.value=.06;
    lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(700,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);o2.connect(g2);g2.connect(g);o3.connect(g3);g3.connect(g);g.connect(lp);lp.connect(dry);lp.connect(wet);
    [o,o2,o3].forEach(function(x){x.start(t);x.stop(t+dur+.05)});
  }
  function pad(c,t,dur){
    [c.n[0],c.n[1],c.n[2]].forEach(function(m){
      [-6,6].forEach(function(dt){
        var o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
        o.type='triangle';o.frequency.value=f(m-12);o.detune.value=dt;
        lp.type='lowpass';lp.frequency.value=700;
        g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.022,t+dur*.45);g.gain.linearRampToValueAtTime(.0001,t+dur+1.4);
        o.connect(lp);lp.connect(g);g.connect(dry);g.connect(wet);o.start(t);o.stop(t+dur+1.5);
      });
    });
    pluck(c.b,t,.18,dur*1.2);
  }
  function tick(){
    if(!ctx)return;
    if(next<ctx.currentTime-.3)next=ctx.currentTime+.05;
    while(next<ctx.currentTime+.35){
      var bar=Math.floor(step/8)%4,s=step%8,c=CH[bar];
      if(s===0)pad(c,next,E*8);
      pluck(c.n[ARP[s]],next,s===0?.16:(s%2?.07:.1),1.9);
      if(step>=16){
        if(s===0)pluck(c.m[0],next,.1,3);
        if(s===3)pluck(c.m[1],next,.08,2.4);
        if(s===6)pluck(c.m[2],next,.08,2.4);
      }
      next+=E;step++;
    }
  }
  function silentWav(){
    var n=2000,buf=new ArrayBuffer(44+n),v=new DataView(buf);
    var w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
    for(var i=0;i<n;i++)v.setUint8(44+i,128);
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  }
  function silent(play){
    try{
      if(!sil){sil=new Audio(silentWav());sil.loop=true}
      if(play){var pr=sil.play();if(pr&&pr.catch)pr.catch(function(){})}else sil.pause();
    }catch(e){}
  }
  function ui(){btn.classList.toggle('on',on);btn.setAttribute('aria-pressed',on?'true':'false')}
  function start(){
    if(on)return;
    if(!ctx&&!build())return;
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    if(ctx.resume)ctx.resume();
    silent(true);
    clearTimeout(fadeT);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(.9,ctx.currentTime,.9);
    if(!timer){next=ctx.currentTime+.1;timer=setInterval(tick,90)}
    on=true;ui();
  }
  function stop(){
    if(!ctx||!on)return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setTargetAtTime(0,ctx.currentTime,.2);
    fadeT=setTimeout(function(){clearInterval(timer);timer=0;if(ctx.suspend)ctx.suspend()},900);
    silent(false);on=false;ui();
  }
  document.addEventListener('visibilitychange',function(){
    if(!ctx)return;
    if(document.hidden){if(ctx.suspend)ctx.suspend()}else if(on){if(ctx.resume)ctx.resume()}
  });
  btn.addEventListener('click',function(){on?stop():start()});
  return {start:start,stop:stop};
})();

/* ================= text builders ================= */
function words(el,text,start,step){
  el.textContent='';
  var parts=text.split(' ');
  parts.forEach(function(w,i){
    var s=document.createElement('span');
    s.className='w'+(/[❤✨]/.test(w)?' emo':'');
    s.style.setProperty('--d',(start+i*step).toFixed(2)+'s');
    s.textContent=w;el.appendChild(s);
    if(i<parts.length-1)el.appendChild(document.createTextNode(' '));
  });
  return start+parts.length*step;
}
function letters(el,text,start,step){
  el.textContent='';var k=0;
  var parts=text.split(' ');
  parts.forEach(function(w,wi){
    var ws=document.createElement('span');ws.className='word';
    Array.from(w).forEach(function(ch){
      var s=document.createElement('span');s.className='ltr';
      s.style.setProperty('--d',(start+k*step).toFixed(2)+'s');
      s.textContent=ch;ws.appendChild(s);k++;
    });
    el.appendChild(ws);
    if(wi<parts.length-1)el.appendChild(document.createTextNode(' '));
  });
  return start+k*step;
}

/* ================= scene director ================= */
var scenes={1:$('s1'),2:$('s2'),3:$('s3'),4:$('s4'),5:$('s5')};
var timers=[],busy=false;
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

var LINES=[
  'Пусть твоя жизнь будет похожа на самую красивую историю…',
  'Пусть каждый новый день приносит радость, улыбки и приятные сюрпризы.',

  'Никогда не переставай улыбаться, мечтать и сиять.',
  'Ты заслуживаешь всего самого прекрасного! ❤️'
];

    var b=$('b1'),o=$('o1');

  },
  2:function(){
    var b=$('b2');b.classList.remove('show');
    roseOn=true;roseT0=T+.6;
    roseWrap.classList.remove('on');later(function(){roseWrap.classList.add('on')},100);
    letters($('t2a'),'С Днём рождения,',3.4,.05);
    letters($('t2b'),'Рая!',4.5,.2);
    later(function(){updateCenter();burst(rc.x,rc.y,70)},6300);
    later(function(){b.classList.add('show')},8600);
  },

    later(function(){updateCenter();burst(rc.x,rc.y,110)},3000);

    letters($('t4b'),'С самыми тёплыми пожеланиями…',7.2,.045);
    later(function(){b.classList.add('show')},10800);
  },
  5:function(){
    var b=$('b5'),w=$('photoWrap');
    b.classList.remove('show');w.classList.remove('on');
    photoT0=T+1.8;photoAcc=0;
    later(function(){w.classList.add('on')},500);
    later(function(){updateCenter();burst(rc.x,rc.y,100)},2800);
    words($('t5'),'«Самой прекрасной девушке — в её особенный день! ❤️»',4.8,.2);
    later(function(){b.classList.add('show')},9200);
  }
};

function go(n){
  if(busy)return;busy=true;clearTimers();
  var pc=cur;
  if(cur)scenes[cur].classList.remove('active');
  setTimeout(function(){
    cur=n;document.body.setAttribute('data-s',n);
    scenes[n].classList.add('active');scenes[n].scrollTop=0;
    ENTER[n]();busy=false;
  },pc?950:300);
  setTimeout(function(){
    if(pc===2&&cur!==2)roseOn=false;
    if(pc===4&&cur!==4)heartOn=false;
  },2400);
}

function press(id,fn){
  var b=$(id);
  b.addEventListener('click',function(){
    var r=b.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,38);
    fn();
  });
}
press('b1',function(){Music.start();go(2)});
press('b2',function(){go(3)});
press('b3',function(){go(4)});
press('b4',function(){go(5)});
press('b5',function(){go(1)});
heartBox.addEventListener('click',function(e){burst(e.clientX,e.clientY,60)});

/* ================= pointer ================= */
var lastSpark=0;
addEventListener('pointermove',function(e){
  tpx=(e.clientX/W-.5)*2;tpy=(e.clientY/H-.5)*2;
  var n=performance.now();
  if(n-lastSpark>40){lastSpark=n;spark(e.clientX,e.clientY)}
},{passive:true});
addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('button'))return;
  burst(e.clientX,e.clientY,14);
},{passive:true});

/* ================= main loop ================= */
var tilt=$('roseTilt'),last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  px+=(tpx-px)*.05;py+=(tpy-py)*.05;
  drawStars(dt);drawFx(dt);
  if(roseOn)animRose();
  if(cur===2){
    tilt.style.setProperty('--ry',(px*9).toFixed(2)+'deg');
    tilt.style.setProperty('--rx',(-py*7).toFixed(2)+'deg');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(function(t){last=t;frame(t)});

go(1);
})();
